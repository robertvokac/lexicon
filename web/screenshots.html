<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screenshots — Lexicon</title>
<meta name="description" content="Screenshots of Lexicon, the desktop knowledge dictionary: main window, Markdown editor, metadata management, links and backlinks.">
<link rel="icon" type="image/png" href="assets/img/appicon.png">
<link rel="stylesheet" href="css/style.css">
<script>(function(){var t;try{t=localStorage.getItem("lexicon-theme")}catch(e){}if(!t){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)})();</script>
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html"><img class="brand-icon" src="assets/img/appicon.png" alt="Lexicon icon"><span>Lexicon</span></a>
    <nav class="site-nav" id="siteNav">
      <a href="index.html">Home</a>
      <a href="screenshots.html" class="active">Screenshots</a>
      <a href="users/index.html">Users</a>
      <a href="developers/index.html">Developers</a>
      <a href="https://github.com/robertvokac/lexicon" target="_blank" rel="noopener">GitHub&nbsp;↗</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme">🌙</button>
      <button class="icon-btn nav-burger" id="navBurger" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<main class="section">
  <div class="container">
    <h1 style="text-align:center">Screenshots</h1>
    <p class="section-lead">A tour of Lexicon's interface. Click any image to view it full size.</p>

    <div class="gallery">
      <figure>
        <img src="assets/img/Screenshot.png" alt="Main window — filters, searchable item table, pagination, rendered Markdown content, and link/backlink preview">
        <figcaption>
          <strong>Main window</strong>
          <span>Filters, searchable item table, pagination, rendered Markdown content, and link/backlink preview — all in one screen.</span>
        </figcaption>
      </figure>
      <figure>
        <img src="assets/img/Screenshot_General.png" alt="Item editor — General tab with group, title, disambiguation, status, understanding, and pinned fields">
        <figcaption>
          <strong>Item editor — General tab</strong>
          <span>Basic identity and state of an item: group, title, disambiguation, status, understanding level, and pinned flag.</span>
        </figcaption>
      </figure>
      <figure>
        <img src="assets/img/Screenshot_Content.png" alt="Item editor — Content tab with Markdown editor on the left and live preview on the right">
        <figcaption>
          <strong>Item editor — Content tab</strong>
          <span>Markdown editor on the left, live rendered preview on the right, plus a formatting toolbar.</span>
        </figcaption>
      </figure>
      <figure>
        <img src="assets/img/Screenshot_Metadata.png" alt="Item editor — Metadata tab for managing tags, flags, and aliases">
        <figcaption>
          <strong>Item editor — Metadata tab</strong>
          <span>Manage tags, flags, and aliases with dedicated add/edit/remove controls.</span>
        </figcaption>
      </figure>
      <figure>
        <img src="assets/img/Screenshot_Links.png" alt="Item editor — Links tab for creating outgoing relationships to other items">
        <figcaption>
          <strong>Item editor — Links tab</strong>
          <span>Create and maintain outgoing typed relationships to other items.</span>
        </figcaption>
      </figure>
      <figure>
        <img src="assets/img/Screenshot_Backlinks.png" alt="Item editor — Backlinks tab showing incoming relationships from other items">
        <figcaption>
          <strong>Item editor — Backlinks tab</strong>
          <span>Create and maintain incoming relationships — see who references this item.</span>
        </figcaption>
      </figure>
    </div>

    <p style="text-align:center; margin-top:2.5rem">
      <a class="btn btn-primary" href="users/getting-started.html">Learn how to use it</a>
      <a class="btn btn-ghost" href="users/installation.html">Install Lexicon</a>
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="margin-top:0; padding-top:0; border-top:none">
      <p>Lexicon is free and open-source software released under the <a href="https://github.com/robertvokac/lexicon/blob/main/LICENSE" target="_blank" rel="noopener">MIT License</a>. © 2026 Robert Vokac.</p>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
